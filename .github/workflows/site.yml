name: Website

# Deploys site/ to Vercel when a merge to main changes it. Vercel gets no
# access to the repository: this job pushes to Vercel with a token that only
# main's runs can read. The design is docs/projects/installer/readme.md § 2.10.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site.yml
      - .github/vercel/**
      - .github/scripts/check-site.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The production environment admits only main and holds VERCEL_TOKEN, so
    # a pull request's run can never read the token.
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL_CLI: ${{ github.workspace }}/.github/vercel/node_modules/.bin/vercel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the redirects
        run: .github/scripts/check-site.sh static
      - name: Install the locked Vercel CLI
        working-directory: .github/vercel
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # The CLI runs a native binary from this locked package. Without
          # it, the CLI would download one at run time, outside the lock.
          test -d node_modules/@vercel/vc-native-linux-x64
      - name: Record the production deployment to roll back to
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The token goes to curl on stdin, never in its arguments.
          deployment="$(printf 'Authorization: Bearer %s\n' "$VERCEL_TOKEN" |
            curl -fsS --proto '=https' -H @- \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1" |
            jq -r '.deployments[0].uid // empty')"
          echo "deployment=$deployment" >>"$GITHUB_OUTPUT"
      - name: Deploy
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: '"$VERCEL_CLI" deploy --prod --yes'
      # Checked with curl, not the CLI, so a bad redirect the CLI deployed
      # is caught all the same.
      - name: Check the live redirects
        id: live
        run: .github/scripts/check-site.sh live https://getmultipass.dev
      - name: Roll back a deployment whose redirects fail
        if: failure() && steps.live.outcome == 'failure' && steps.previous.outputs.deployment != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS: ${{ steps.previous.outputs.deployment }}
        run: '"$VERCEL_CLI" rollback "$PREVIOUS" --yes'
