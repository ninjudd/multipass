name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: No dependencies
        run: |
          deps="$(cargo tree -e all --prefix none)"
          echo "$deps"
          if [ "$(printf '%s\n' "$deps" | wc -l)" -ne 1 ]; then
            echo "::error::multipass must have no dependencies; see AGENTS.md"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
